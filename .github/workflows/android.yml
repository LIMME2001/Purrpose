name: Build Android APK

# Runs the unit tests and builds a debug APK on every push and pull request.
# The APK is attached to the run as an artifact: Actions tab -> the run -> "purrpose-debug-apk".
# Pushes to main also update the "latest" GitHub Release with purrpose.apk (Releases page, right side of the repo).
# You can also start it by hand from the Actions tab (Run workflow).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # The Android SDK is preinstalled on GitHub's ubuntu runners, so no setup step is needed.

      - run: npm ci
      - run: npm test

      - name: Copy the web app into the Android project
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: purrpose-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish the APK as the latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk purrpose.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest purrpose.apk --target "$GITHUB_SHA" --prerelease \
            --title "Purrpose (latest build)" \
            --notes "Debug APK built from commit ${GITHUB_SHA::7}. On your phone: download purrpose.apk, open it and allow installing from this source."
